# Heap calibrée : tient sur 4 Go de RAM (CI / sandbox / laptop léger).
# Sur une machine > 8 Go, on peut remonter à -Xmx4G pour accélérer le build.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
