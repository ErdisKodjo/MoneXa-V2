name: monexa
description: "MoneXa — CFO virtuel pour PME ouest-africaines. Application mobile Flutter offline-first pour la gestion de trésorerie Mobile Money."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6

  # Networking
  dio: ^5.7.0

  # Storage offline-first
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0

  # Router
  go_router: ^14.2.7

  # i18n
  intl: ^0.20.2

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0

  # Image picker
  image_picker: ^1.1.2

  # Saisie vocale (TresorIA — FR / Ewé / Kabyé selon locale du téléphone)
  # v7 : résout le conflit js ^0.6/^0.7 avec flutter_secure_storage_web
  speech_to_text: ^7.5.0

  # Utilities
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

# Évite le build natif CMake (jni) de path_provider_android >= 2.3 :
# supprime l'exigence NDK pour compiler l'APK dans un environnement contraint.
dependency_overrides:
  path_provider_android: 2.2.10

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
